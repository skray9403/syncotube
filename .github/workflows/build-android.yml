name: Build Android
# Build and publish the minimal Android client artifact.

on:
  pull_request:
    branches: [android-only]
  push:
    branches: [minimal-youtube-lyrics, android-only]
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build and upload as an artifact
        type: choice
        options: [release, debug]
        default: release

concurrency:
  # Keep the minimal-client APK build isolated from unrelated repository builds.
  group: android-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: read
    with:
      variant: ${{ inputs.variant || 'debug' }}
      upload-artifact: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' }}
      require-signing: ${{ inputs.variant == 'release' }}
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
      LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
